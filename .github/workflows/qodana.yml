name: Qodana Code Quality Scan

on:
  workflow_dispatch:
  push:
    branches: ["main", "dev", "test", "qa", "prod"]
  pull_request:
    branches: ["main", "dev", "test", "qa", "prod"]

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2024.3.4
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
